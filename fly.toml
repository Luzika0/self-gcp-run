# Fly.io app configuration for self-gcp-run
# Xray VLESS over WebSocket listens on 0.0.0.0:8080.
# Fly Proxy terminates public HTTPS and forwards WebSocket traffic here.

app = 'self-gcp-run'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
