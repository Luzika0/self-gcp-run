# fly.toml app configuration file generated for self-gcp-run on 2026-11-02T02:05:55Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'self-gcp-run'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
