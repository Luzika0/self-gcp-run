name: Deploy Xray to Fly.io

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "fly.toml"
      - "config.template.json"
      - "entrypoint.sh"
      - ".github/workflows/fly-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-deploy-self-gcp-run
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          test -n "$FLY_API_TOKEN" || {
            echo "::error::Add FLY_API_TOKEN in GitHub repository Actions secrets."
            exit 1
          }
          flyctl deploy --remote-only --app self-gcp-run
