services:
  self-gcp-run:
    build:
      context: .
      dockerfile: Dockerfile
    image: self-gcp-run:local
    container_name: self-gcp-run
    restart: unless-stopped
    environment:
      VLESS_UUID: ${VLESS_UUID:?Set VLESS_UUID in your shell before running Docker Compose}
      GRPC_SERVICE_NAME: ${GRPC_SERVICE_NAME:-grpc}
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
