services:
  self-gcp-run:
    build:
      context: .
      dockerfile: Dockerfile
    image: self-gcp-run:local
    container_name: self-gcp-run
    restart: unless-stopped
    environment:
      VLESS_UUID: ${VLESS_UUID:?Set VLESS_UUID in your shell before running Docker Compose}
      WS_PATH: ${WS_PATH:?Set WS_PATH in your shell before running Docker Compose}
      PORT: "8080"
      XRAY_PORT: "8081"
    ports:
      - "127.0.0.1:8080:8080"
