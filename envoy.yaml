static_resources:
  listeners:
    - name: cloud_run_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: cloud_run_http
                codec_type: AUTO
                route_config:
                  name: local_routes
                  virtual_hosts:
                    - name: service
                      domains: ["*"]
                      routes:
                        # gRPC requests are POSTs with an application/grpc content type.
                        # Route by content type so any configured gRPC service name works.
                        - match:
                            prefix: "/"
                            headers:
                              - name: content-type
                                string_match:
                                  prefix: "application/grpc"
                          route:
                            cluster: xray_grpc
                            timeout: 0s
                        - match:
                            path: "/healthz"
                          direct_response:
                            status: 200
                            body:
                              inline_string: "OK\n"
                          response_headers_to_add:
                            - header:
                                key: "content-type"
                                value: "text/plain; charset=utf-8"
                        - match:
                            prefix: "/"
                          direct_response:
                            status: 200
                            body:
                              inline_string: |
                                <!doctype html>
                                <html lang="en">
                                  <head>
                                    <meta charset="utf-8">
                                    <meta name="viewport" content="width=device-width,initial-scale=1">
                                    <title>Self GCP Run — Service Status</title>
                                  </head>
                                  <body style="font-family:system-ui,sans-serif;max-width:720px;margin:56px auto;padding:24px;line-height:1.6;color:#172033">
                                    <h1>☁️ Service is running</h1>
                                    <p>Your Cloud Run web endpoint is responding.</p>
                                    <p><strong>Transport:</strong> VLESS over gRPC</p>
                                    <p>This page checks the web endpoint only. It does not prove that a VLESS client can connect.</p>
                                  </body>
                                </html>
                          response_headers_to_add:
                            - header:
                                key: "content-type"
                                value: "text/html; charset=utf-8"
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: xray_grpc
      connect_timeout: 5s
      type: STATIC
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: xray_grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 10000

admin:
  access_log_path: /tmp/envoy-admin.log
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
